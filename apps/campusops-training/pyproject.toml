[project]
name = "campusops-training"
version = "0.1.0"
description = "Load PDFs, split them into chunks, embed them with OpenAI and store them in Qdrant."
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "google-genai>=3.6.1",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false
